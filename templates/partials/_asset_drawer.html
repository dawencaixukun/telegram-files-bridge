{# ====================================================================
   _asset_drawer.html — 全局资产智能关联详情与查重拦截抽屉/模态框
   ==================================================================== #}
<div class="modal-backdrop asset-drawer-backdrop" id="browseAssetBackdrop" onclick="if(event.target===this) window.__closeBrowseAssetDrawer()">
  <div class="modal asset-drawer-modal" role="dialog" aria-modal="true" aria-label="文件资产智能关联详情">
    <div class="modal-head">
      <div class="modal-head-title" style="display:flex;align-items:center;gap:8px;">
        <span id="assetDrawerIcon" style="font-size:22px;">☁️</span>
        <h2 id="assetDrawerHeading" style="margin:0;font-size:18px;">资产智能关联详情</h2>
      </div>
      <button type="button" class="icon-btn xs" aria-label="关闭" onclick="window.__closeBrowseAssetDrawer()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><use href="#ic-x"/></svg>
      </button>
    </div>

    <div class="modal-body" id="assetDrawerBody" style="font-size:14px;line-height:1.6;">
      <div class="card pad-md" style="background:var(--surface-2);border-radius:var(--radius-md);margin-bottom:var(--space-4);">
        <div style="font-weight:600;font-size:15px;word-break:break-all;" id="assetDrawerName">—</div>
        <div style="color:var(--text-3);font-size:12px;margin-top:4px;" id="assetDrawerMeta">—</div>
      </div>

      <div id="assetDrawerPrompt" class="quick-status-banner info" style="margin-bottom:var(--space-4);padding:10px 14px;border-radius:var(--radius-sm);">
        —
      </div>

      <div class="asset-details-list" id="assetDrawerDetails" style="display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);border:1px solid var(--border-subtle);">
        <!-- 动态属性行 -->
      </div>
    </div>

    <div class="modal-foot" id="assetDrawerFoot" style="justify-content:flex-end;gap:var(--space-3);flex-wrap:wrap;margin-top:var(--space-5);">
      <button type="button" class="btn ghost" onclick="window.__closeBrowseAssetDrawer()">关闭</button>
      <button type="button" class="btn" id="assetDrawerActionPrimary" style="display:none;"></button>
      <button type="button" class="btn primary" id="assetDrawerActionSecondary" style="display:none;"></button>
    </div>
  </div>
</div>
